{% extends "layout.html" %}
{% block content %}
<style>
  .st-wrap { max-width: 880px; margin: 1rem auto; padding: 0 16px 2rem; }
  .st-title { text-align: center; color: var(--gold); font-family: var(--font-display); text-shadow: 0 0 12px rgba(255,210,74,0.25); letter-spacing: 2px; }
  .st-meta { text-align: center; color: var(--text-dim); margin-bottom: 14px; }
  .st-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  .st-card { background: linear-gradient(180deg, var(--surface), var(--surface-2)); border: 1px solid var(--border); border-left: 4px solid var(--success); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-sm); }
  .st-card.locked { border-left-color: var(--border); opacity: 0.6; }
  .st-name { font-weight: bold; color: var(--text); margin-bottom: 8px; font-size: 1.1rem; }
  .st-card.locked .st-name::before { content: "🔒 "; }
  .st-card.unlocked .st-name::before { content: "📖 "; }
  .st-text { color: var(--text-dim); font-size: 0.95rem; line-height: 1.8; white-space: pre-line; }
</style>
<div class="st-wrap">
  <h2 class="st-title">― ものがたり ―</h2>
  <div class="st-meta">解禁 {{ unlocked }} / {{ total }}　断章</div>
  <ul class="st-list">
    {% for e in entries %}
      <li class="st-card {{ 'unlocked' if e.unlocked else 'locked' }}">
        <div class="st-name">{{ e.title }}</div>
        <div class="st-text">{{ e.text }}</div>
      </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
