{% extends "layout.html" %}
{% block content %}
<style>
  .st-wrap { max-width: 760px; margin: 0 auto; padding: 18px; }
  .st-title { text-align: center; color: #cbb; text-shadow: 1px 1px 2px #000; letter-spacing: 2px; }
  .st-meta { text-align: center; color: #999; margin-bottom: 14px; }
  .st-list { list-style: none; padding: 0; display: grid; gap: 14px; }
  .st-card { background: #211f26; border-left: 3px solid #6a5; border-radius: 8px; padding: 14px 16px; }
  .st-card.locked { border-left-color: #444; opacity: 0.6; }
  .st-name { font-weight: bold; color: #e8e0c8; margin-bottom: 6px; }
  .st-card.locked .st-name::before { content: "🔒 "; }
  .st-card.unlocked .st-name::before { content: "📖 "; }
  .st-text { color: #cfc8b8; font-size: 0.92rem; line-height: 1.7; white-space: pre-line; }
  .st-back { display: block; text-align: center; margin-top: 20px; }
</style>
<div class="st-wrap">
  <h2 class="st-title">― ものがたり ―</h2>
  <div class="st-meta">解禁 {{ unlocked }} / {{ total }}　断章</div>
  <ul class="st-list">
    {% for e in entries %}
      <li class="st-card {{ 'unlocked' if e.unlocked else 'locked' }}">
        <div class="st-name">{{ e.title }}</div>
        <div class="st-text">{{ e.text }}</div>
      </li>
    {% endfor %}
  </ul>
  <a class="st-back" href="{{ url_for('play', user_id=user_id) }}">戻る</a>
</div>
{% endblock %}
