{% extends "layout.html" %}
{% block content %}
<div class="log-page">
  <div class="panel">
    <h2 class="log-page-title">最新のバトルログ</h2>
    <ul class="blog-list">
      {% for m in log %}
        <li class="log-message-{{ m.type }}">{{ m.message }}</li>
      {% else %}
        <li class="blog-empty">ログがありません。</li>
      {% endfor %}
    </ul>
  </div>
</div>
<style>
  .log-page { max-width: 760px; margin: 1.5rem auto; padding: 0 16px; }
  .log-page-title { font-family: var(--font-display); color: var(--gold); margin: 0 0 14px; letter-spacing: 1px; }
  .blog-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
  .blog-list li { padding: 8px 10px; border-bottom: 1px solid var(--border-soft); line-height: 1.5; }
  .blog-list li:last-child { border-bottom: none; }
  .blog-empty { color: var(--text-faint); font-style: italic; }
</style>
{% endblock %}
