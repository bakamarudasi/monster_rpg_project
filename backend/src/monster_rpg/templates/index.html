{% extends "layout.html" %}
{% block content %}
<div class="container">
  <h1>モンスター合成RPG</h1>
  <div class="form-card">
    <form action="{{ url_for('auth.start_game') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="username" placeholder="名前" required>
      <input name="password" type="password" placeholder="パスワード">
      <button type="submit">新規ゲーム</button>
    </form>
  </div>
  <div class="form-card">
    <form action="{{ url_for('auth.load_existing') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="user_id" placeholder="User ID" required>
      <button type="submit">ロード</button>
    </form>
  </div>
  <div class="form-card">
    <form action="{{ url_for('auth.login') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="username" placeholder="ユーザー名" required>
      <input name="password" type="password" placeholder="パスワード" required>
      <button type="submit">ログイン</button>
    </form>
  </div>
</div>
<style>
  .container {
    max-width: 420px;
    margin: 48px auto 0 auto;
    padding: 28px 24px 32px;
    text-align: center;
  }
  .container h1 {
    margin-bottom: 28px;
    font-family: var(--font-display);
    font-size: 2.1rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--gold), #fff3c4 55%, var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 12px rgba(255, 210, 74, 0.25);
  }
  .form-card {
    margin-bottom: 20px;
    padding: 22px 18px;
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: box-shadow .2s, transform .2s, border-color .2s;
  }
  .form-card:hover {
    box-shadow: var(--shadow), var(--shadow-glow);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .container input {
    width: 82%;
    padding: 12px 14px;
    margin-bottom: 12px;
    color: var(--text);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 1rem;
    background: rgba(8, 14, 24, 0.6);
    transition: border .2s, box-shadow .2s;
    outline: none;
  }
  .container input::placeholder { color: var(--text-faint); }
  .container input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .container button {
    width: 86%;
    padding: 12px 0;
    margin-top: 2px;
    color: #fff;
    background: linear-gradient(180deg, var(--accent), var(--accent-strong));
    border: 1px solid #6aa6ee;
    border-radius: var(--radius-sm);
    font-weight: bold;
    letter-spacing: 1px;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 3px 0 #0a3f7d, var(--shadow-sm);
    transition: filter .15s, box-shadow .15s, transform .08s;
  }
  .container button:hover { filter: brightness(1.1); box-shadow: 0 3px 0 #0a3f7d, var(--shadow-glow); }
  .container button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0a3f7d; }
</style>
{% endblock %}
